[project]
name = "jarvis-tui"
version = "0.1.0"
description = "JARVIS-like terminal TUI agent with local AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AnkarIIT", email = "ankar@iit.edu"}
]
keywords = ["ai", "assistant", "tui", "terminal", "jarvis", "llm", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.52",
    "ollama>=0.3",
    "mcp>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",

    "vosk>=0.3",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",

    "aiohttp>=3.9",
]

[project.optional-dependencies]
llama_cpp = ["llama-cpp-python>=0.2"]
voice = ["pvporcupine>=3.0", "piper-tts>=1.2"]
dev = ["pytest", "pytest-asyncio", "textual-dev", "ruff", "mypy"]
all = ["llama-cpp-python>=0.2", "pvporcupine>=3.0"]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-mcp-filesystem = "jarvis.mcp.servers.filesystem:main"
jarvis-mcp-terminal = "jarvis.mcp.servers.terminal:main"
jarvis-mcp-git = "jarvis.mcp.servers.git:main"
jarvis-mcp-memory = "jarvis.mcp.servers.memory:main"
jarvis-mcp-web-search = "jarvis.mcp.servers.web_search:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]